<!-- Usage: {% include affiliate-box.html title="" description="" link="" link_text="" note="" %} -->
<div style="margin:1.5rem 0;padding:1rem 1.2rem;border:1px solid rgba(100,160,255,0.35);border-left:3px solid #4a9eff;border-radius:6px;background:rgba(74,158,255,0.04);">
  <p style="margin:0 0 0.4rem;font-weight:600;font-size:0.95rem;">{{ include.title }}</p>
  <p style="margin:0 0 0.75rem;font-size:0.9rem;line-height:1.65;">{{ include.description }}</p>
  <a href="{{ include.link }}"
     target="_blank"
     rel="nofollow noopener noreferrer"
     style="display:inline-block;padding:0.4rem 1rem;background:#4a9eff;color:#fff!important;border-radius:4px;font-size:0.88rem;font-weight:500;text-decoration:none;">
    {{ include.link_text }}
  </a>
  {% if include.note %}
  <small style="display:block;margin-top:0.5rem;opacity:0.55;font-size:0.78rem;">{{ include.note }}</small>
  {% endif %}
</div>
